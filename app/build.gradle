plugins {
    id 'com.android.application'
}

def env = System.getenv()

android {
    namespace 'id.mchost'
    compileSdk 34

    defaultConfig {
        applicationId 'id.akhmad.mchost'
        minSdk 26
        // Must stay <= 28: newer targets forbid exec() of binaries in the app data dir (java, playitd).
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode((env.GITHUB_RUN_NUMBER ?: '1').toInteger())
        versionName "1.0.${env.GITHUB_RUN_NUMBER ?: '0'}"
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            // Default: the keystore committed in keystore/ so every CI build can update the previous install.
            // Override with repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
            storeFile file(env.KEYSTORE_FILE ?: '../keystore/mchost.jks')
            storePassword env.KEYSTORE_PASSWORD ?: 'mchost123'
            keyAlias env.KEY_ALIAS ?: 'mchost'
            keyPassword env.KEY_PASSWORD ?: 'mchost123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress.addAll(['bin', 'gz'])
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable.addAll(['ExpiredTargetSdkVersion', 'OldTargetApi'])
    }
}
