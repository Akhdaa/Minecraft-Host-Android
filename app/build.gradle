plugins {
    id 'com.android.application'
}

def env = System.getenv()

android {
    namespace 'id.mchost'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minecrafthost.id'
        minSdk 26
        // Must stay <= 28: newer targets forbid exec() of binaries in the app data dir (java, playitd).
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode((env.GITHUB_RUN_NUMBER ?: '1').toInteger())
        versionName "1.0.${env.GITHUB_RUN_NUMBER ?: '0'}"
        ndk { abiFilters 'arm64-v8a' }
    }

    // The release key lives only in repo secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD);
    // CI decodes it to KEYSTORE_FILE. Without it (local builds, fork PRs) the APK is signed with the debug key.
    def releaseKey = env.KEYSTORE_FILE
    signingConfigs {
        release {
            if (releaseKey) {
                storeFile file(releaseKey)
                storePassword env.KEYSTORE_PASSWORD
                keyAlias env.KEY_ALIAS
                keyPassword env.KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (releaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress.addAll(['bin', 'gz'])
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable.addAll(['ExpiredTargetSdkVersion', 'OldTargetApi'])
    }
}
