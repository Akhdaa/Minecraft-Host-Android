// MC Host for Windows: the same core and panel as the Android app, shown in a WebView2 window (SWT Edge).
plugins {
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:3.135.0'
}

sourceSets {
    main {
        java {
            // core is shared with the Android app; only the core package compiles here
            srcDirs = ['src/main/java', '../app/src/main/java']
            include 'id/mchost/core/**', 'id/mchost/desktop/**'
        }
        resources {
            srcDirs = ['../app/src/main/assets']
            include 'panel/**'
        }
    }
}

application {
    mainClass = 'id.mchost.desktop.DesktopMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
