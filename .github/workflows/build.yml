name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      jdk:
        description: 'Paket JDK Termux (openjdk-17 untuk MC 1.20.1, openjdk-21 untuk MC 1.20.5+)'
        default: 'openjdk-17'
      playit:
        description: 'Ikut build tunnel playitd'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JDK_PKG: ${{ github.event.inputs.jdk || 'openjdk-17' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Java runtime untuk Android (Termux ${{ env.JDK_PKG }} aarch64)
        run: python3 scripts/fetch_termux_runtime.py --pkg "$JDK_PKG" --out app/src/main/assets/runtime

      - name: Cache cargo (playitd)
        if: github.event.inputs.playit != 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            build/playit
          key: playit-${{ runner.os }}-${{ hashFiles('scripts/build_playit.sh') }}-v1

      - name: Build playitd untuk Android (tunnel, opsional)
        id: playit
        if: github.event.inputs.playit != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_playit.sh app/src/main/assets/runtime

      - name: Kunci signing dari secrets (opsional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Cek isi APK
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'assets/(runtime|panel)/'
          unzip -l "$APK" | grep -q 'assets/runtime/jre.tar.gz' || { echo "::error::Java runtime tidak masuk APK"; exit 1; }
          if unzip -l "$APK" | grep -q 'assets/runtime/playitd'; then TUN=ada; else TUN="tidak ada"; echo "::warning::playitd tidak ikut, tunnel nonaktif di build ini"; fi
          NAME="MCHost-1.0.${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tunnel=$TUN" >> "$GITHUB_OUTPUT"
          echo "runtime=$(cat app/src/main/assets/runtime/version)" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish ke Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Build #${{ github.run_number }} dari ${GITHUB_SHA::7}
          Java runtime: ${{ steps.apk.outputs.runtime }}
          Tunnel playitd: ${{ steps.apk.outputs.tunnel }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --title "MC Host $GITHUB_REF_NAME" --notes "$NOTES"
          else
            cp "${{ steps.apk.outputs.name }}" MCHost-latest.apk
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest MCHost-latest.apk "${{ steps.apk.outputs.name }}" --target "$GITHUB_SHA" --title "MC Host build #${{ github.run_number }}" --notes "$NOTES" --latest
          fi
