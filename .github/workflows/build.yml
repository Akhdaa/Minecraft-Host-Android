name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      playit:
        description: 'Ikut build tunnel playitd'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # MC 1.17-1.20.4 needs Java 17, 1.20.5-1.21.x Java 21, 26.x Java 25; the app extracts only the ones it uses
      - name: Java runtime untuk Android (Termux OpenJDK 17, 21, 25 aarch64)
        run: |
          for v in 17 21 25; do
            python3 scripts/fetch_termux_runtime.py --pkg "openjdk-$v" --name "jre$v" --out app/src/main/assets/runtime | tee -a runtime.log
          done
          grep -E 'WARNING|paket:|selesai' runtime.log | grep -v 'libc.so.6' | sed 's/^/::notice::/' | head -30

      - name: Cache cargo (playitd)
        if: github.event.inputs.playit != 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            build/playit
          key: playit-${{ runner.os }}-${{ hashFiles('scripts/build_playit.sh') }}-v1

      - name: Build playitd untuk Android (tunnel, opsional)
        id: playit
        if: github.event.inputs.playit != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_playit.sh app/src/main/assets/runtime

      - name: Nomor versi (1.0.N, naik 1 dari rilis terakhir; "[keep version]" di pesan commit = tidak naik)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          PREV=$(gh release view latest --json name -q .name 2>/dev/null | grep -oE '[0-9]+$' || true)
          case "$MSG" in *"[keep version]"*) if [ -n "$PREV" ]; then echo "APP_PATCH=$PREV" >> "$GITHUB_ENV"; exit 0; fi ;; esac
          echo "APP_PATCH=$(( ${PREV:-0} + 1 ))" >> "$GITHUB_ENV"

      - name: Kunci signing dari secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # fork PRs get no secrets: debug-signed APK, never published
            [ "${{ github.event_name }}" = pull_request ] && { echo "::warning::tanpa kunci release, APK debug"; exit 0; }
            echo "::error::secret KEYSTORE_BASE64 kosong, build release butuh kunci signing"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Cek isi APK
        id: apk
        run: |
          echo "::notice::assets/runtime di repo: $(ls -la app/src/main/assets/runtime | tr '\n' ' ')"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::APK tidak ditemukan: $(find app/build/outputs -type f | tr '\n' ' ')"; exit 1; }
          LIST=$(unzip -l "$APK")
          echo "::notice::APK $APK, assets: $(echo "$LIST" | grep -E 'assets/' | awk '{print $1" "$4}' | tr '\n' ' ')"
          for v in 17 21 25; do echo "$LIST" | grep -q "assets/runtime/jre$v.bin" || { echo "::error::Java $v tidak masuk APK"; exit 1; }; done
          if echo "$LIST" | grep -q 'assets/runtime/playitd'; then TUN=ada; else TUN="tidak ada"; echo "::warning::playitd tidak ikut, tunnel nonaktif di build ini"; fi
          NAME="MCHost-1.0.$APP_PATCH.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tunnel=$TUN" >> "$GITHUB_OUTPUT"
          RT=$(cat app/src/main/assets/runtime/*.version | paste -sd ',' | sed 's/,/, /g')
          echo "runtime=$RT" >> "$GITHUB_OUTPUT"
          echo "::notice::$NAME $(du -h "$NAME" | cut -f1), runtime $RT, tunnel $TUN"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish ke Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Build #${{ github.run_number }} dari ${GITHUB_SHA::7}
          Java runtime: ${{ steps.apk.outputs.runtime }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" --title "MC Host $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest "${{ steps.apk.outputs.name }}" --target "$GITHUB_SHA" --title "MC Host 1.0.$APP_PATCH" --notes "$NOTES" --latest
          fi

